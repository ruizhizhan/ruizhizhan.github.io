{{ define "main" }}
{{ partial "life/styles.html" . }}
<main class="life-shell">
    <section class="life-wrap">
      <div class="life-breadcrumb"><a href="/life/">Life</a><span>/</span><span>{{ .Title }}</span></div>
      <div class="life-section-head">
        <div>
          <h1 class="life-title">{{ .Title }}</h1>
          {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
        </div>
      </div>
      <ul class="life-index-list">
        {{ range sort .RegularPages "Date" "desc" }}
          <li>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </li>
        {{ end }}
      </ul>
    </section>
</main>
{{ end }}
